spring.application.name=user-api

# ==========================================
# DATASOURCE CONFIGURATION
# ==========================================
# Removed the trailing slash at the end of the database name
spring.datasource.url=jdbc:postgresql://localhost:5432/db_user
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# Automatically updates the database schema based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update

# NOTE: hibernate.dialect parameter removed.
# Spring Boot automatically detects PostgreSQLDialect from the JDBC URL.

# Prints executed SQL queries to the console log
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true